# ===================================================================
# MediSense - Application Properties
# Production-Grade Health-Tech RAG Configuration
# ===================================================================

spring.application.name=medisense-backend
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (PostgreSQL + pgvector)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medisense_db}
spring.datasource.username=${DB_USER:medisense_user}
spring.datasource.password=${DB_PASS:medisense_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Flyway Database Migration
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# Redis Caching Layer Configuration
# -------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Spring Actuator & Health Endpoints
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# -------------------------------------------------------------------
# ABDM HIU Integration Settings
# -------------------------------------------------------------------
medisense.abdm.gateway-url=${ABDM_GATEWAY_URL:https://dev.abdm.gov.in/gateway}
medisense.abdm.client-id=${ABDM_CLIENT_ID:YOUR_ABDM_CLIENT_ID_PLACEHOLDER}
medisense.abdm.client-secret=${ABDM_CLIENT_SECRET:YOUR_ABDM_CLIENT_SECRET_PLACEHOLDER}
medisense.abdm.hiu-id=${ABDM_HIU_ID:YOUR_HIU_ID_PLACEHOLDER}
medisense.abdm.callback-url=${ABDM_CALLBACK_URL:https://api.medisense.health/v1/abdm/callback}

# -------------------------------------------------------------------
# RAG & LLM Engine Settings (LangChain4j / Gemini)
# -------------------------------------------------------------------
medisense.llm.provider=gemini
medisense.llm.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_PLACEHOLDER}
medisense.llm.model-name=gemini-1.5-pro
medisense.llm.temperature=0.2
medisense.llm.timeout-seconds=30
medisense.llm.fallback-ollama-url=${OLLAMA_URL:http://localhost:11434}

# -------------------------------------------------------------------
# Reranker Microservice
# -------------------------------------------------------------------
medisense.reranker.url=${RERANKER_URL:http://localhost:8001}

# -------------------------------------------------------------------
# Vector Store (pgvector HNSW)
# -------------------------------------------------------------------
medisense.vectorstore.dimension=768
medisense.vectorstore.hnsw-m=16
medisense.vectorstore.hnsw-ef-construction=200
medisense.embedding.batch-size=32
medisense.embedding.max-retries=5
medisense.embedding.backoff-initial-delay-ms=500
medisense.postgres.maintenance-work-mem=512MB

# -------------------------------------------------------------------
# Lucene BM25 Sparse Index Configuration
# -------------------------------------------------------------------
medisense.lucene.index-dir=${LUCENE_INDEX_DIR:./data/lucene_index}

# -------------------------------------------------------------------
# OCR (Tess4j / Tesseract) Configuration
# -------------------------------------------------------------------
medisense.ocr.tessdata-path=${TESSDATA_PATH:/usr/share/tesseract-ocr/4.00/tessdata}
medisense.ocr.language=eng

# -------------------------------------------------------------------
# Sarvam AI Translation Settings (Tamil & Tanglish Support)
# -------------------------------------------------------------------
medisense.translation.sarvam.api-key=${SARVAM_API_KEY:YOUR_SARVAM_API_KEY_PLACEHOLDER}
medisense.translation.sarvam.base-url=${SARVAM_BASE_URL:https://api.sarvam.ai}
medisense.translation.sarvam.default-target-language=ta-IN

# -------------------------------------------------------------------
# Guardrail & Safety Engine Configurations
# -------------------------------------------------------------------
medisense.safety.confidence-threshold=0.85
medisense.safety.fixed-referral-message=MediSense explains health information. It does not replace your doctor. Please consult a qualified medical professional for diagnosis or treatment decisions.
medisense.ratelimit.requests-per-minute=20
medisense.ratelimit.admin-requests-per-minute=10
medisense.cors.allowed-origins=${REACT_APP_FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
medisense.jwt.access-expiration-ms=900000
medisense.jwt.refresh-expiration-ms=604800000
medisense.jwt.private-key=${JWT_PRIVATE_KEY:}
medisense.jwt.public-key=${JWT_PUBLIC_KEY:}
