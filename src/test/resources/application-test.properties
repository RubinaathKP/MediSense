# ===================================================================
# MediSense - Test Application Properties (application-test.properties)
# Used for Unit, Integration, and E2E Test Suites
# ===================================================================

spring.application.name=medisense-backend-test
server.port=0

# -------------------------------------------------------------------
# Database Configuration (PostgreSQL + pgvector / Dynamic Testcontainers)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///medisense_test?TC_IMAGE_TAG=pgvector/pgvector:pg16
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Flyway Database Migration in Test Mode
# -------------------------------------------------------------------
spring.flyway.enabled=false

# -------------------------------------------------------------------
# Redis Caching (Embedded or Mocked in Test Mode)
# -------------------------------------------------------------------
spring.data.redis.host=${REDIS_TEST_HOST:localhost}
spring.data.redis.port=${REDIS_TEST_PORT:6379}
spring.data.redis.timeout=1000ms

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# -------------------------------------------------------------------
# External APIs Mock Configuration (WireMock endpoints)
# -------------------------------------------------------------------
wiremock.server.port=${wiremock.port:8089}

# Gemini LLM Provider
medisense.llm.provider=gemini
medisense.llm.api-key=test-gemini-mock-api-key
medisense.llm.model-name=gemini-1.5-pro
medisense.llm.temperature=0.0
medisense.llm.timeout-seconds=5
medisense.llm.fallback-ollama-url=http://localhost:${wiremock.server.port}/ollama

# Sarvam Translation API
medisense.translation.sarvam.api-key=test-sarvam-mock-api-key
medisense.translation.sarvam.base-url=http://localhost:${wiremock.server.port}/sarvam
medisense.translation.sarvam.default-target-language=ta-IN

# ABDM Gateway Integration
medisense.abdm.gateway-url=http://localhost:${wiremock.server.port}/v0.5
medisense.abdm.client-id=TEST_ABDM_CLIENT_ID
medisense.abdm.client-secret=TEST_ABDM_CLIENT_SECRET
medisense.abdm.hiu-id=TEST_HIU_ID
medisense.abdm.callback-url=http://localhost:8080/v1/abdm/callback

# Reranker Service
medisense.reranker.url=http://localhost:${wiremock.server.port}/rerank

# -------------------------------------------------------------------
# Vector Store & Search
# -------------------------------------------------------------------
medisense.vectorstore.dimension=768
medisense.vectorstore.hnsw-m=16
medisense.vectorstore.hnsw-ef-construction=200
medisense.embedding.batch-size=8
medisense.embedding.max-retries=2
medisense.embedding.backoff-initial-delay-ms=100
medisense.lucene.index-dir=target/test-lucene-index

# -------------------------------------------------------------------
# OCR (Tess4j) Test Configuration
# -------------------------------------------------------------------
medisense.ocr.tessdata-path=src/test/resources/tessdata
medisense.ocr.language=eng

# -------------------------------------------------------------------
# Guardrails & Security
# -------------------------------------------------------------------
medisense.safety.confidence-threshold=0.85
medisense.safety.fixed-referral-message=MediSense explains health information. It does not replace your doctor. Please consult a qualified medical professional for diagnosis or treatment decisions.
medisense.ratelimit.requests-per-minute=1000
medisense.ratelimit.admin-requests-per-minute=1000
medisense.jwt.access-expiration-ms=3600000
medisense.jwt.refresh-expiration-ms=86400000
medisense.jwt.private-key=
medisense.jwt.public-key=

# Logging
logging.level.com.medisense=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
